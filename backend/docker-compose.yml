services:
  postgres:
    image: postgres:16-alpine
    container_name: dentflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dentflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dentflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-dentflow}
      TZ: ${TIMEZONE:-Asia/Kolkata}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dentflow} -d ${POSTGRES_DB:-dentflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dentflow-net

  redis:
    image: redis:7-alpine
    container_name: dentflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dentflow-net

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: dentflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentflow-net

  minio-init:
    image: minio/mc:latest
    container_name: dentflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123};
      mc mb -p local/${S3_BUCKET:-dentflow-media} || true;
      mc anonymous set none local/${S3_BUCKET:-dentflow-media};
      exit 0;
      "
    networks:
      - dentflow-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: dentflow-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_SERVICE_PORT: 8000
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dentflow-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dentflow-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: api
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentflow}:${POSTGRES_PASSWORD:-dentflow_secret}@postgres:5432/${POSTGRES_DB:-dentflow}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ai-service:
        condition: service_healthy
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - dentflow-net

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: dentflow-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_MODE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-dentflow}:${POSTGRES_PASSWORD:-dentflow_secret}@postgres:5432/${POSTGRES_DB:-dentflow}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["node", "dist/worker.js"]
    networks:
      - dentflow-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  dentflow-net:
    driver: bridge

